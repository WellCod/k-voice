[project]
name = "kvoice"
version = "0.1.0"
description = "Servidor de síntese de voz com streaming para LiveKit e lote para WhatsApp"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
