  # -----------------------------------------------------------------------
  # Ordinais
  # -----------------------------------------------------------------------
  - id: ordinal_masc
    entrada: "chegou em 1º lugar"
    esperado: "chegou em primeiro lugar"

  - id: ordinal_fem
    entrada: "é a 2ª vez"
    esperado: "é a segunda vez"

  - id: ordinal_decimo
    entrada: "10º andar"
    esperado: "décimo andar"

  # -----------------------------------------------------------------------
  # Datas
  # -----------------------------------------------------------------------
  - id: data_completa
    entrada: "15/03/2025"
    esperado: "quinze de março de dois mil e vinte e cinco"

  - id: data_primeiro
    entrada: "01/01/2024"
    esperado: "um de janeiro de dois mil e vinte e quatro"

  # -----------------------------------------------------------------------
  # Horas
  # -----------------------------------------------------------------------
  - id: hora_exata
    entrada: "às 14:00"
    esperado: "às quatorze horas"

  - id: hora_com_minutos
    entrada: "às 9:30"
