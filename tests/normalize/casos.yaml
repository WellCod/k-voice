  # Percentagens
  # -----------------------------------------------------------------------
  - id: pct_inteiro
    entrada: "taxa de 12%"
    esperado: "taxa de doze por cento"

  - id: pct_decimal
    entrada: "crescimento de 3,5%"
    esperado: "crescimento de três vírgula cinco por cento"

  - id: pct_cem
    entrada: "100% aprovados"
    esperado: "cem por cento aprovados"

  # -----------------------------------------------------------------------
  # Decimais
  # -----------------------------------------------------------------------
  - id: decimal_virgula
    entrada: "3,14 de pi"
    esperado: "três vírgula quatorze de pi"

  - id: decimal_taxa
    entrada: "taxa de 1,75 ao mês"
    esperado: "taxa de um vírgula setenta e cinco ao mês"

  # -----------------------------------------------------------------------
  # Temperatura
  # -----------------------------------------------------------------------
  - id: celsius_inteiro
    entrada: "35°C"
    esperado: "trinta e cinco graus Celsius"

  # -----------------------------------------------------------------------
  # Dicionário de pronúncia
  # -----------------------------------------------------------------------
  - id: dict_nome_proprio
    entrada: "fale com a Klubi"
    dict:
      Klubi: "Klúbi"
    esperado: "fale com a Klúbi"

  # -----------------------------------------------------------------------
  # Modo incremental
  # -----------------------------------------------------------------------
  - id: incremental_sem_fronteira
    entrada: "R$ 1.2"
    incremental: true
    pronto: ""
    pendente: "R$ 1.2"

  - id: incremental_com_fronteira
    entrada: "Seu saldo é R$ 100,00. "
    incremental: true
    pronto: "Seu saldo é cem reais."
    pendente: ""

  - id: incremental_mantém_pendente
    entrada: "Olá! Seu número é (11) 9"
    incremental: true
    pronto: "Olá!"
    pendente: "Seu número é (11) 9"
