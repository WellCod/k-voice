casos:
  # -----------------------------------------------------------------------
  # Moeda
  # -----------------------------------------------------------------------
  - id: moeda_simples
    entrada: "R$ 1.234,50"
    esperado: "mil duzentos e trinta e quatro reais e cinquenta centavos"

  - id: moeda_zero_centavos
    entrada: "R$ 100,00"
    esperado: "cem reais"

  - id: moeda_so_centavos
    entrada: "R$ 0,50"
    esperado: "cinquenta centavos"

  - id: moeda_um_real
    entrada: "R$ 1,00"
    esperado: "um real"

  - id: moeda_um_centavo
    entrada: "R$ 0,01"
    esperado: "um centavo"

  - id: moeda_milhao
    entrada: "R$ 1.000.000,00"
    esperado: "um milhão de reais"

  - id: moeda_real_e_centavos
    entrada: "R$ 1,50"
    esperado: "um real e cinquenta centavos"

