  # Telefone
  # -----------------------------------------------------------------------
  - id: telefone_celular
    entrada: "(11) 98765-4321"
    esperado: "onze, nove oito sete seis cinco, quatro três dois um"

  - id: telefone_fixo
    entrada: "(21) 3456-7890"
    esperado: "vinte e um, três quatro cinco seis, sete oito nove zero"

  # -----------------------------------------------------------------------
  # CPF
  # -----------------------------------------------------------------------
  - id: cpf_numero
    entrada: "123.456.789-09"
    esperado: "um dois três, quatro cinco seis, sete oito nove, zero nove"

  - id: cpf_com_sigla
    entrada: "CPF 123.456.789-09"
    esperado: "cê pê efe um dois três, quatro cinco seis, sete oito nove, zero nove"

  # -----------------------------------------------------------------------
  # CNPJ
  # -----------------------------------------------------------------------
  - id: cnpj_numero
    entrada: "12.345.678/0001-90"
    esperado: "um dois, três quatro cinco, seis sete oito, zero zero zero um, nove zero"

  # -----------------------------------------------------------------------
  # CEP
  # -----------------------------------------------------------------------
  - id: cep_numero
    entrada: "01310-100"
    esperado: "zero um três um zero, um zero zero"

