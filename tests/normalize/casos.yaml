  # Siglas (acrônimos)
  # -----------------------------------------------------------------------
  - id: sigla_cpf_isolada
    entrada: "seu CPF"
    esperado: "seu cê pê efe"

  - id: sigla_pix
    entrada: "via PIX"
    esperado: "via pix"

  - id: sigla_tv
    entrada: "na TV"
    esperado: "na tevê"

  - id: sigla_led
    entrada: "luz LED"
    esperado: "luz led"

  - id: sigla_rg
    entrada: "seu RG"
    esperado: "seu erre gê"

  - id: sigla_ted
    entrada: "por TED"
    esperado: "por tê ê dê"

