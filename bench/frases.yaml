  # --- Frases longas ---

  - id: longa_01
    texto: >
      Identificamos uma pendência no seu contrato referente ao mês de outubro.
      Para regularizar a situação sem juros adicionais, o pagamento deve ser
      efetuado até o dia 30 deste mês.
    categoria: frase_longa

  - id: longa_02
    texto: >
      Para concluir a portabilidade do seu seguro, precisamos de três documentos:
      o comprovante de residência atualizado, o documento de identificação com foto
      e a apólice atual com o número de registro.
    categoria: frase_longa

  - id: longa_03
    texto: >
      Com base no seu histórico de utilização e no perfil do veículo informado,
      identificamos que você se qualifica para o nosso plano de fidelidade,
      que oferece desconto progressivo de até 20% na renovação anual.
    categoria: frase_longa

  - id: longa_04
    texto: >
      A análise do sinistro foi concluída e o valor aprovado para reembolso
      é de R$ 2.850,00. O depósito será realizado na conta cadastrada
      em até cinco dias úteis após a assinatura do termo de encerramento.
    categoria: frase_longa

  - id: longa_05
    texto: >
      Vou te explicar como funciona o processo. Primeiro, você acessa o aplicativo
      e tira uma foto dos documentos. Depois, o sistema faz a análise automática
      e, em até duas horas, você recebe a confirmação por e-mail ou SMS.
    categoria: frase_longa

